# Reject a `Release-As:` trailer at the point it would enter the repository.
#
# Which text becomes the squashed commit is a REPOSITORY SETTING, not a property
# of this workflow, and it has already changed once underneath this file. Read it
# with `gh api repos/OWNER/REPO --jq .squash_merge_commit_message`; do not trust
# this comment, which asserted COMMIT_MESSAGES and was overtaken.
#
# Observed on this repository's own history, which is the only evidence that
# survives the change (a settings edit leaves no audit trail on a personal repo):
# 7cf612e (PR #58, two commits) carries its COMMIT messages, while de4b006
# (PR #62) and 41abc64 (PR #67) carry their PR BODIES -- and PR #62's two source
# commits have no body at all, so the text can only have come from the PR.
# `gh pr merge --squash` does not insulate anything either: it omits commitBody
# from the mutation unless `--body` is passed (cli/cli
# pkg/cmd/pr/merge/http.go:72), so GitHub applies the repository default.
#
# Therefore neither guard below may key off the setting. Both read EVERY
# candidate source -- the PR's commits, the PR title and the PR body -- and fail
# closed on any of them. Checking only the source that happens to be live today
# is how the parse guard came to validate text that never landed while skipping
# the text that did. A false positive costs a reword; the miss costs a release.
#
# release-please parses a `Release-As:` footer and short-circuits all version
# derivation, so a merged benign-looking PR can dictate the published version --
# and PyPI never permits version reuse.
#
# An anchored semver check in release.yml is NOT sufficient on its own: the
# payload `Release-As: 99.0.0` yields the perfectly well-formed tag v99.0.0.
# release.yml's verify-version job catches the jump; this catches the trailer.
#
# Both steps below treat the checkout as UNTRUSTED. It is a contributor's merge
# tree, so nothing is installed from it, nothing is written into it, and no code
# is resolved out of it.
name: pr-checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  no-release-as:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject commit messages release-please cannot parse
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Interpolated into env, never into `run:` -- a PR title is attacker text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # release-please logs the parse error and then exits 0, so an unparseable
        # message means "no release PR" with a green workflow and no other signal.
        # A body line beginning `identifier(` is read as a `type(scope):` header;
        # if the parens nest the scope never closes and the message is discarded,
        # taking any BREAKING CHANGE footer with it.
        run: |
          set -euo pipefail

          # Install AND run the parser outside the PR checkout. Three separate
          # things are needed and none of them substitutes for the others:
          #
          #  1. --prefix, so npm's project config is $CCP/.npmrc rather than the
          #     contributor's. Verified: without it `npm config get registry`
          #     returns whatever a PR-supplied .npmrc says.
          #  2. The script lives in $CCP too. NODE_PATH is NOT enough on its own --
          #     node walks node_modules up from the SCRIPT's directory first and
          #     only then consults NODE_PATH, so a PR shipping
          #     node_modules/@conventional-commits/parser shadows it. Verified by
          #     execution. Resolving from $CCP cannot be shadowed.
          #  3. --ignore-scripts and a pinned version, so the dependency itself is
          #     fixed and installs nothing executable.
          CCP="$RUNNER_TEMP/ccp"
          mkdir -p "$CCP"
          npm install --prefix "$CCP" --no-save --silent --ignore-scripts \
            --registry=https://registry.npmjs.org \
            @conventional-commits/parser@0.4.1

          cat > "$CCP/check-commit-msg.js" <<'JS'
          const { parser } = require("@conventional-commits/parser");
          const msg = require("fs").readFileSync(process.argv[2], "utf8");
          try {
            parser(msg);
          } catch (e) {
            console.log("::error::release-please cannot parse this commit message: " + e.message);
            console.log("::error::A body line starting with name( is read as type(scope): -- indent it or reword.");
            process.exit(1);
          }
          JS

          git log --format='%H' "$BASE..$HEAD" | while read -r sha; do
            git log -1 --format='%B' "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            node "$CCP/check-commit-msg.js" "$RUNNER_TEMP/commit-msg.txt" || exit 1
            echo "ok: $sha"
          done

          # The commits above are only HALF the candidates, and under the current
          # repository setting they are the half that does NOT land: the squashed
          # commit release-please actually parses is `PR title` + blank + `PR body`.
          # 41abc64 is the worked example -- its two commit messages passed this
          # very loop and were then discarded at merge in favour of the PR body,
          # which nothing had parsed. Check both sources unconditionally rather
          # than reading the setting, so a settings flip cannot silently reopen
          # the hole in either direction.
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/squash-msg.txt"
          node "$CCP/check-commit-msg.js" "$RUNNER_TEMP/squash-msg.txt"
          echo "ok: squash message (PR title + PR body)"

          # ...and again WRAPPED, because that is the text that actually lands.
          #
          # GitHub hard-wraps the PR body when it writes the squash commit. Measured
          # against c5cf9bc (PR #77): the PR body's longest line was 587 characters
          # and every line of the landed commit is at most 72. So the gate above can
          # pass on a line the repository never sees.
          #
          # That is not hypothetical -- it is how #77 got in. Its body carried
          #
          #     `_run_guarded(cmd, *, timeout, grace=_TERM_GRACE_SECONDS, **popen_kwargs)` ...
          #
          # which parses fine on one line: the scope opened by `(` closes later on
          # the same line. The wrap split it after `grace=_TERM_GRACE_SECONDS,`, so
          # the landed line BEGINS `identifier(` and never closes. release-please
          # logged `unexpected token` and exited 0, the release workflow went green,
          # and 4.0.2's changelog silently lost the fix it was cut for.
          #
          # `fold -s` is an approximation of GitHub's wrapping, not a reproduction,
          # so it is defence in depth for the exact check below -- never a substitute.
          fold -s -w 72 "$RUNNER_TEMP/squash-msg.txt" > "$RUNNER_TEMP/squash-wrapped.txt"
          node "$CCP/check-commit-msg.js" "$RUNNER_TEMP/squash-wrapped.txt"
          echo "ok: squash message, wrapped at 72 as GitHub writes it"

          # The load-bearing check: refuse the SHAPE at column 0.
          #
          # Reject any line that BEGINS `identifier(` -- with or without the backtick
          # that makes it look safe -- because that is what release-please chokes on,
          # and whether a given line ends up in that shape after wrapping is GitHub's
          # business, not something to predict.
          #
          # Anchored at column 0 on purpose, and the anchor is load-bearing in the
          # other direction too: CLAUDE.md's measured table records that an INDENTED
          # `  a(b(c)) here` parses. Allowing leading whitespace here would reject the
          # documented remedy and leave an author with nowhere to go -- caught by a
          # positive control, which is the only reason it is not still wrong.
          #
          # Deliberately stricter than the parser. Per this file's header, a false
          # positive costs a reword and the miss costs a release -- and the miss has
          # now happened once.
          if grep -nE '^`?[A-Za-z_][A-Za-z0-9_.-]*\(' "$RUNNER_TEMP/squash-msg.txt"; then
            echo "::error::A line above begins with name( -- after GitHub wraps the body at 72"
            echo "::error::columns that becomes an unterminated type(scope): header, release-please"
            echo "::error::drops the whole commit and exits 0. Indent it, bullet it, or reword."
            exit 1
          fi
          echo "ok: no squash-message line begins with name("

      - name: Reject Release-As trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # The squashed subject can come from the PR title -- currently always, as
          # squash_merge_commit_title reads PR_TITLE, and previously for any
          # multi-commit PR under COMMIT_OR_PR_TITLE. Either way it is not in
          # git log, so it is scanned explicitly. This step was already correct
          # under both settings because it reads every source; see the header.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          {
            git log --format='%B' "$BASE..$HEAD"
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY"
          } > "$RUNNER_TEMP/release-as-scan.txt"
          # Match the BARE token. release-please does not run a regex: it parses the
          # commit and looks for a footer whose TOKEN lowercases to `release-as`
          # (src/commit.ts), so every separator the conventional-commits grammar
          # allows is honoured. `Release-As #4.1.0`, `Release-As(core): 4.1.0`,
          # `Release-As!: 4.1.0` and `Release-As! #4.1.0` are all accepted by
          # release-please and all slipped past the old colon-anchored pattern. Any
          # character class after the token is guessing at a grammar release-please
          # never consults; fail closed instead. False positives cost nothing here --
          # the scanned text is only the PR title, PR body and commit messages.
          if grep -qiE '^[[:space:]]*Release-As' "$RUNNER_TEMP/release-as-scan.txt"; then
            echo "::error::A Release-As trailer overrides release-please version derivation. Remove it."
            exit 1
          fi
          echo "No Release-As trailer found."
