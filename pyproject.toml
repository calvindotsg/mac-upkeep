[project]
name = "mac-upkeep"
version = "4.0.1"
description = "Automated macOS maintenance CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]
authors = [{name = "Calvin"}]
keywords = ["macos", "maintenance", "homebrew", "cli", "automation", "system-administration", "developer-tools", "cache-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/calvindotsg/mac-upkeep"
Repository = "https://github.com/calvindotsg/mac-upkeep"
Issues = "https://github.com/calvindotsg/mac-upkeep/issues"
Changelog = "https://github.com/calvindotsg/mac-upkeep/blob/main/CHANGELOG.md"

[project.scripts]
mac-upkeep = "mac_upkeep.cli:app"

[dependency-groups]
# pytest is floored at the CVE-2025-71176 fix (GHSA-6w46-j5rx-g56g), not left at
# the ">=8" the project started with. Through 9.0.2, getbasetemp() stat'd
# `<tmpdir>/pytest-of-<user>` following symlinks, so a symlink planted at that
# predictable path was followed; 9.0.3 lstat's it and refuses a symlink outright.
# uv.lock pins a fixed release, but a lock is a record of one resolution, not a
# constraint on the next: `uv lock --upgrade`, a lock regenerated from scratch,
# or anyone installing this group without the lock can pick a vulnerable version
# straight back up. The floor is what makes the fix survive a re-resolve.
dev = ["ruff>=0.8", "pytest>=9.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_upkeep"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
