# Built-in task definitions for mac-upkeep.
# Users override in ~/.config/mac-upkeep/config.toml

[tasks.brew_update]
description = "Update Homebrew package database"
command = "brew update"
detect = "brew"

[tasks.brew_upgrade]
description = "Upgrade outdated formulae and casks"
command = "brew upgrade"
detect = "brew"

[tasks.gcloud]
description = "Update Google Cloud SDK components"
command = "gcloud components update --quiet"
detect = "gcloud"
frequency = "monthly"

[tasks.pnpm]
description = "Prune pnpm content-addressable store"
command = "pnpm store prune"
detect = "pnpm"
frequency = "monthly"
# Disabled by default: on pnpm 11 `store prune` corrupts the global virtual
# store, removing in-use packages (pnpm/pnpm#10132). Re-enable per-machine via
# `[tasks.pnpm]\nenabled = true` once upstream is fixed.
enabled = false

[tasks.uv]
description = "Prune uv package cache"
command = "uv cache prune --force"
detect = "uv"
frequency = "monthly"

[tasks.fisher]
description = "Update Fish shell plugins"
command = "fisher update"
detect = "fish"
shell = "fish --interactive -c"

# Runs as the invoking user, NOT root. mole is designed to elevate the individual
# operations that need it, and running the whole tool as root is outside mole's
# stated threat model: with `env_keep HOME` it let anything running as the user
# steer root-privileged touch/chown/rm through paths inside $HOME.
#
# Non-interactively (stdin closed) `mo clean` reaches bin/clean.sh's else-branch,
# which calls adopt_sudo_session -> `sudo -n -v`. The -n means it NEVER prompts:
# with no sudo ticket it simply sets SYSTEM_CLEAN=false, skips system-level
# cleanup and carries on cleaning user caches. Measured cost of losing the
# privileged half: ~7MB/week of files in /private/var/log.
[tasks.mo_clean]
description = "Clean user caches"
command = "${BREW_PREFIX}/bin/mo clean"
detect = "${BREW_PREFIX}/bin/mo"
# Observed successful runs span 146-280s, so the 300s default sat ~7% above the
# worst case and timed out on roughly a third of runs. 900s leaves real headroom
# for a cold cache without masking a genuine hang.
timeout = 900

# Disabled by default, and NOT merely de-sudoed. bin/optimize.sh calls
# ensure_sudo_session unconditionally whenever MOLE_DRY_RUN != 1, with no
# non-interactive guard -- so under launchd, where there is no controlling
# terminal, request_sudo_access takes its is_gui_mode branch and puts up an
# osascript password dialog that would sit on screen until the task times out.
# Unprivileged it would also achieve almost nothing: DNS flush, font database
# reset, route/ARP flush, Spotlight reindex and disk permissions are all
# root-only. Run `mo optimize` by hand when you want it.
[tasks.mo_optimize]
description = "Optimize DNS, Spotlight, fonts, Dock (run by hand)"
command = "${BREW_PREFIX}/bin/mo optimize"
detect = "${BREW_PREFIX}/bin/mo"
enabled = false

[tasks.mo_purge]
description = "Remove old project artifacts"
command = "${BREW_PREFIX}/bin/mo purge"
detect = "${BREW_PREFIX}/bin/mo"
frequency = "monthly"

[tasks.brew_cleanup]
description = "Remove old versions and cache files"
command = "brew cleanup --prune=all"
detect = "brew"
frequency = "monthly"

[tasks.brew_bundle]
description = "Remove packages not in Brewfile"
command = "brew bundle cleanup --force --file=${BREWFILE}"
detect = "brew"
require_file = "${BREWFILE}"

[tasks.git_sync]
description = "Pull configured git repositories"
handler = "git_sync"
detect = "git"
frequency = "daily"

[tasks.editor_cache]
description = "Clear Electron/editor caches when their apps are closed"
handler = "editor_cache"
frequency = "monthly"
# Opt-in: deletes app caches (rm -rf) and ships to all users. Enable per-machine
# via `[tasks.editor_cache]\nenabled = true`. Targets Notion + Zed by default;
# override with [[editor_cache.apps]] in your config.
enabled = false

[run]
order = [
    "brew_update",
    "brew_upgrade",
    "gcloud",
    "pnpm",
    "uv",
    "fisher",
    "mo_clean",
    "mo_optimize",
    "mo_purge",
    "brew_cleanup",
    "brew_bundle",
    "git_sync",
    "editor_cache",
]
